[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wm-audit"
version = "0.1.0"
description = "Reproducible frozen-world-model PushT audits"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "gymnasium==1.4.0",
    "pygame==2.6.1",
    "pymunk==7.3.1",
    "shapely==2.2.0",
    "opencv-python-headless==4.11.0.86",
    # Local-version CUDA/CPU wheels satisfy these pins. Bootstrap installs
    # them FIRST from the selected official index and constrains their builds.
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.57.6",
    "einops==0.8.2",
    "omegaconf==2.3.0",
    "loguru==0.7.3",
    "h5py==3.15.1",
    "hdf5plugin==6.0.0",
    "zstandard==0.25.0",
    "huggingface-hub==0.36.2",
    "tqdm==4.67.1",
    "matplotlib==3.10.7",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
wm-audit = "wm_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wm_audit*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"